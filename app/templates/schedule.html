{% extends "base.html" %}
{% block title %}排班管理 - 电销班表{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">排班管理</div>
    <div class="page-subtitle">查看和管理团队排班</div>
  </div>
  <div class="page-actions" id="managerActions" style="display:none">
    <button class="btn btn-ghost btn-sm" onclick="copyLastWeek()">📋 复制上周</button>
    <button class="btn btn-primary btn-sm" onclick="openBatchModal()">➕ 批量排班</button>
  </div>
</div>

<!-- 视图切换 + 月份导航 -->
<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap">
  <div class="tabs" style="margin-bottom:0">
    <button class="tab-btn active" id="tabTeam" onclick="switchView('team')">团队周视图</button>
    <button class="tab-btn" id="tabCalendar" onclick="switchView('calendar')">月历视图</button>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
    <button class="btn btn-ghost btn-sm" onclick="prevPeriod()">‹ 上一期</button>
    <span id="periodLabel" style="font-size:13px;font-weight:600;min-width:120px;text-align:center"></span>
    <button class="btn btn-ghost btn-sm" onclick="nextPeriod()">下一期 ›</button>
    <button class="btn btn-ghost btn-sm" onclick="goToday()">今天</button>
  </div>
</div>

<!-- 团队周视图 -->
<div id="teamView" class="glass content-card">
  <div id="teamTableWrap" class="table-wrap"></div>
</div>

<!-- 月历视图 -->
<div id="calendarView" class="glass content-card" style="display:none">
  <div id="calendarGrid"></div>
</div>

<!-- 批量排班 Modal -->
<div class="modal-overlay" id="batchModal">
  <div class="modal" style="min-width:500px">
    <div class="modal-title">📅 批量排班</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label class="form-label">开始日期</label>
        <input class="input" id="batchStart" type="date">
      </div>
      <div>
        <label class="form-label">结束日期</label>
        <input class="input" id="batchEnd" type="date">
      </div>
    </div>
    <div style="margin:16px 0 8px;font-size:12px;color:var(--text-secondary)">每日班次设置（留空=不排班）</div>
    <div id="patternGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"></div>
    <div style="margin-top:16px">
      <label class="form-label">选择员工</label>
      <div id="empSelector" style="max-height:150px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeBatchModal()">取消</button>
      <button class="btn btn-primary" onclick="submitBatch()">确认排班</button>
    </div>
  </div>
</div>

<!-- 调整单日班次 Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">修改班次</div>
    <input type="hidden" id="editScheduleId">
    <div style="margin-bottom:12px">
      <label class="form-label">选择班次</label>
      <select class="select" id="editShiftSelect"></select>
    </div>
    <div>
      <label class="form-label">备注（可选）</label>
      <input class="input" id="editRemark" type="text" placeholder="修改原因...">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentView = 'team';
let currentDate = new Date();
let shifts = [];
let teamEmployees = [];

async function init() {
  const user = await loadCurrentUser();
  if (user && user.role_level >= 2) {
    document.getElementById('managerActions').style.display = '';
  }

  const sData = await API.get('/api/shifts');
  shifts = sData.shifts;

  if (currentUser && currentUser.team_id) {
    // 加载本组员工
    try {
      const eData = await API.get('/api/schedules', {
        start_date: DateUtil.today(), end_date: DateUtil.today(), team_id: currentUser.team_id
      });
    } catch(e) {}
  }

  renderPeriodLabel();
  loadSchedules();
  buildPatternGrid();
  loadEmpSelector();
}

function renderPeriodLabel() {
  if (currentView === 'team') {
    const mon = getMonday(currentDate);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    document.getElementById('periodLabel').textContent =
      `${mon.getMonth()+1}/${mon.getDate()} - ${sun.getMonth()+1}/${sun.getDate()}`;
  } else {
    document.getElementById('periodLabel').textContent =
      `${currentDate.getFullYear()}年 ${currentDate.getMonth()+1}月`;
  }
}

function getMonday(d) {
  const m = new Date(d);
  m.setDate(d.getDate() - (d.getDay() || 7) + 1);
  return m;
}

function switchView(view) {
  currentView = view;
  document.getElementById('teamView').style.display = view === 'team' ? '' : 'none';
  document.getElementById('calendarView').style.display = view === 'calendar' ? '' : 'none';
  document.getElementById('tabTeam').classList.toggle('active', view === 'team');
  document.getElementById('tabCalendar').classList.toggle('active', view === 'calendar');
  renderPeriodLabel();
  loadSchedules();
}

function prevPeriod() {
  if (currentView === 'team') currentDate.setDate(currentDate.getDate() - 7);
  else currentDate.setMonth(currentDate.getMonth() - 1);
  renderPeriodLabel(); loadSchedules();
}
function nextPeriod() {
  if (currentView === 'team') currentDate.setDate(currentDate.getDate() + 7);
  else currentDate.setMonth(currentDate.getMonth() + 1);
  renderPeriodLabel(); loadSchedules();
}
function goToday() { currentDate = new Date(); renderPeriodLabel(); loadSchedules(); }

async function loadSchedules() {
  let start, end;
  const fmt = d => d.toISOString().slice(0,10);
  if (currentView === 'team') {
    start = getMonday(currentDate);
    end = new Date(start); end.setDate(start.getDate() + 6);
  } else {
    start = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    end = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
  }

  const params = { start_date: fmt(start), end_date: fmt(end) };
  if (currentUser && currentUser.team_id && currentUser.role_level < 3) {
    params.team_id = currentUser.team_id;
  }
  const data = await API.get('/api/schedules', params);

  if (currentView === 'team') renderTeamView(data.schedules, start);
  else renderCalendarView(data.schedules, start, end);
}

function renderTeamView(schedules, monday) {
  const empMap = {};
  const dateMap = {};
  schedules.forEach(s => {
    empMap[s.employee_id] = s.employee_name;
    if (!dateMap[s.employee_id]) dateMap[s.employee_id] = {};
    dateMap[s.employee_id][s.work_date] = s;
  });

  const days = ['周一','周二','周三','周四','周五','周六','周日'];
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  const todayStr = DateUtil.today();

  let html = '<table><thead><tr><th>姓名</th>';
  dates.forEach((d, i) => {
    const ds = d.toISOString().slice(0,10);
    const isToday = ds === todayStr;
    html += `<th style="${isToday?'color:#aab4ff':''}">${days[i]}<br><small>${d.getMonth()+1}/${d.getDate()}</small></th>`;
  });
  html += '</tr></thead><tbody>';

  const empIds = [...new Set(schedules.map(s => s.employee_id))];
  if (empIds.length === 0) {
    html += '<tr><td colspan="8" class="empty-state">本周暂无排班记录</td></tr>';
  } else {
    empIds.forEach(eid => {
      html += `<tr><td style="font-weight:500">${empMap[eid]||'--'}</td>`;
      dates.forEach(d => {
        const ds = d.toISOString().slice(0,10);
        const s = dateMap[eid] && dateMap[eid][ds];
        const color = s ? s.color_tag : '#555570';
        const name = s ? s.shift_name : '未排班';
        const canEdit = currentUser && currentUser.role_level >= 2;
        const onclick = (s && canEdit) ? `openEditModal(${s.id})` : (canEdit ? `''` : '');
        html += `<td><span class="shift-chip" style="cursor:${canEdit?'pointer':'default'};display:inline-block;padding:4px 10px;border-radius:20px;background:${color}22;color:${color};font-size:12px;font-weight:600" onclick="${onclick}">${name}</span></td>`;
      });
      html += '</tr>';
    });
  }
  html += '</tbody></table>';
  document.getElementById('teamTableWrap').innerHTML = html;
}

function renderCalendarView(schedules, start, end) {
  const schedMap = {};
  schedules.forEach(s => {
    if (!schedMap[s.work_date]) schedMap[s.work_date] = [];
    schedMap[s.work_date].push(s);
  });

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay() || 7; // 1=Mon
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = DateUtil.today();

  let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">';
  const heads = ['周一','周二','周三','周四','周五','周六','周日'];
  heads.forEach(h => html += `<div style="text-align:center;font-size:11px;color:var(--text-muted);padding:6px 0;text-transform:uppercase">${h}</div>`);

  for (let i = 1; i < firstDay; i++) html += '<div></div>';

  for (let day = 1; day <= daysInMonth; day++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = ds === todayStr;
    const daySchedules = schedMap[ds] || [];
    html += `<div class="glass" style="padding:8px;min-height:80px;${isToday?'border-color:#667eea':''}">
      <div style="font-size:12px;font-weight:${isToday?'700':'400'};color:${isToday?'#aab4ff':'var(--text-secondary)'};margin-bottom:4px">${day}</div>`;
    daySchedules.slice(0, 3).forEach(s => {
      html += `<div style="font-size:11px;padding:2px 6px;border-radius:10px;background:${s.color_tag}22;color:${s.color_tag};margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${s.employee_name}: ${s.shift_name}</div>`;
    });
    if (daySchedules.length > 3) html += `<div style="font-size:10px;color:var(--text-muted)">+${daySchedules.length-3}人</div>`;
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('calendarGrid').innerHTML = html;
}

// ===== 批量排班 =====
function buildPatternGrid() {
  const days = ['周一','周二','周三','周四','周五','周六','周日'];
  const grid = document.getElementById('patternGrid');
  grid.innerHTML = days.map((d, i) => `
    <div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-align:center">${d}</div>
      <select class="select" id="pattern_${i+1}" style="padding:6px 4px;font-size:12px">
        <option value="">休息</option>
        ${shifts.map(s => `<option value="${s.id}">${s.shift_name}</option>`).join('')}
      </select>
    </div>`).join('');
}

async function loadEmpSelector() {
  if (!currentUser || !currentUser.team_id) return;
  const data = await API.get('/api/schedules', {
    start_date: DateUtil.today(), end_date: DateUtil.today(),
    team_id: currentUser.team_id
  });
  // 临时：展示一个全选提示
  document.getElementById('empSelector').innerHTML =
    '<div style="grid-column:1/-1;font-size:12px;color:var(--text-muted)">将对本组所有在职坐席排班（可在后台员工管理中管理人员）</div>';
}

function openBatchModal() {
  buildPatternGrid();
  const today = DateUtil.today();
  const d = new Date(today);
  const mon = new Date(d); mon.setDate(d.getDate() - (d.getDay()||7) + 1 + 7);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  document.getElementById('batchStart').value = mon.toISOString().slice(0,10);
  document.getElementById('batchEnd').value = sun.toISOString().slice(0,10);
  document.getElementById('batchModal').classList.add('active');
}
function closeBatchModal() { document.getElementById('batchModal').classList.remove('active'); }

async function submitBatch() {
  const start = document.getElementById('batchStart').value;
  const end = document.getElementById('batchEnd').value;
  if (!start || !end) { Toast.error('请选择日期范围'); return; }

  const pattern = [];
  for (let i = 1; i <= 7; i++) {
    const val = document.getElementById(`pattern_${i}`).value;
    if (val) pattern.push({ weekday: i, shift_id: parseInt(val) });
  }
  if (pattern.length === 0) { Toast.error('请至少设置一天的班次'); return; }

  // 获取团队员工 - 简化版：传入 team_id 让后端处理
  try {
    // 需要先获取员工列表，此处简化：通过后端员工查询接口
    const empData = await API.get('/api/schedules', { start_date: start, end_date: start, team_id: currentUser.team_id });
    const empIds = [...new Set(empData.schedules.map(s => s.employee_id))];
    if (empIds.length === 0) { Toast.error('该组暂无排班员工，请先手动添加'); closeBatchModal(); return; }

    const res = await API.post('/api/schedules/batch', { employee_ids: empIds, start_date: start, end_date: end, pattern });
    Toast.success(`排班完成：新增 ${res.created} 条，跳过 ${res.skipped} 条`);
    if (res.warnings && res.warnings.length > 0) Toast.info(`⚠️ ${res.warnings.length} 个人力不足预警`);
    closeBatchModal();
    loadSchedules();
  } catch(e) { Toast.error(e.message); }
}

// ===== 修改单日班次 =====
function openEditModal(scheduleId) {
  document.getElementById('editScheduleId').value = scheduleId;
  document.getElementById('editRemark').value = '';
  const sel = document.getElementById('editShiftSelect');
  sel.innerHTML = shifts.map(s => `<option value="${s.id}">${s.shift_name}</option>`).join('');
  document.getElementById('editModal').classList.add('active');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }
async function submitEdit() {
  const id = document.getElementById('editScheduleId').value;
  const shift_id = parseInt(document.getElementById('editShiftSelect').value);
  const remark = document.getElementById('editRemark').value;
  try {
    await API.put(`/api/schedules/${id}`, { shift_id, remark });
    Toast.success('班次已更新');
    closeEditModal();
    loadSchedules();
  } catch(e) { Toast.error(e.message); }
}

async function copyLastWeek() {
  if (!currentUser || !currentUser.team_id) { Toast.error('请先确认所在团队'); return; }
  try {
    const res = await API.post('/api/schedules/copy-week', { team_id: currentUser.team_id });
    Toast.success(`复制完成：新增 ${res.created} 条，跳过 ${res.skipped} 条`);
    loadSchedules();
  } catch(e) { Toast.error(e.message); }
}

init();
</script>
{% endblock %}
