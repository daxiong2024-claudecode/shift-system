<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 电销班表系统</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<style>
body { display: flex; align-items: center; justify-content: center; }
.login-box {
  width: 380px;
  padding: 40px 36px;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.login-logo p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
.login-btn { width: 100%; padding: 11px; font-size: 14px; margin-top: 8px; justify-content: center; }
.login-hint { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); padding: 12px; background: rgba(255,255,255,0.03); border-radius: var(--radius-sm); }
#errorMsg { color: var(--accent-red); font-size: 12px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="glass login-box">
  <div class="login-logo">
    <h1>📋 电销班表系统</h1>
    <p>信贷业务管理平台</p>
  </div>

  <div class="form-group">
    <label class="form-label">工号</label>
    <input class="input" id="empNo" type="text" placeholder="请输入工号" autocomplete="username">
  </div>
  <div class="form-group">
    <label class="form-label">密码</label>
    <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
  </div>

  <p id="errorMsg"></p>
  <button class="btn btn-primary login-btn" onclick="doLogin()">登 录</button>

  <div class="login-hint">
    默认管理员：工号 <strong>admin</strong> 密码 <strong>admin123</strong>
  </div>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const empNo = document.getElementById('empNo').value.trim();
  const pwd = document.getElementById('password').value;
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';

  if (!empNo || !pwd) { errEl.textContent = '请输入工号和密码'; errEl.style.display = 'block'; return; }

  try {
    await API.post('/auth/login', { employee_no: empNo, password: pwd });
    window.location.href = '/';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
